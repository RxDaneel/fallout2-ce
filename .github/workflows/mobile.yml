# Compila la versione con i controlli mobile (controller + tocco diretto)
# per iPhone (.ipa da firmare con Sideloadly) e Android (.apk).
# Parte a ogni push sul ramo controlli-mobile, oppure a mano da Actions.
name: Mobile

on:
  push:
    branches:
      - controlli-mobile
  workflow_dispatch:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: gradle

      - name: Build
        run: |
          cd os/android
          # Il wrapper di Gradle non riesce a scaricare la 7.3.3 (timeout/504):
          # la scarico con curl, con più tentativi e due server, e la passo al
          # wrapper come file locale.
          for url in \
            https://services.gradle.org/distributions/gradle-7.3.3-bin.zip \
            https://downloads.gradle.org/distributions/gradle-7.3.3-bin.zip \
            https://github.com/gradle/gradle-distributions/releases/download/v7.3.3/gradle-7.3.3-bin.zip; do
            curl -fL --retry 8 --retry-all-errors --retry-delay 15 --connect-timeout 30 -o /tmp/gradle.zip "$url" && break
          done
          test -s /tmp/gradle.zip
          sed -i 's|^distributionUrl=.*|distributionUrl=file\\:///tmp/gradle.zip|' gradle/wrapper/gradle-wrapper.properties
          echo "networkTimeout=300000" >> gradle/wrapper/gradle-wrapper.properties
          # Riprova: il download di Gradle a volte va in timeout.
          n=0
          until ./gradlew assembleRelease; do
            n=$((n+1))
            if [ $n -ge 3 ]; then exit 1; fi
            sleep 60
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fallout2-ce-android-controlli
          path: os/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  ios:
    name: iOS
    runs-on: macos-latest
    env:
      # CMake 4 rifiuta i progetti che dichiarano versioni minime < 3.5 (SDL 2.26).
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Build
        run: |
          cmake --preset ios
          cmake --build --preset ios-release
          cd out/build/ios
          cpack -C RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fallout2-ce-ios-controlli
          path: out/build/ios/fallout2-ce.ipa
          retention-days: 30

  release:
    name: Pubblica
    needs: [android, ios]
    # Gli APK escono anche se la build iOS fallisce o viene annullata
    # (i runner macOS a volte restano in coda): in quel caso resta l'ultimo .ipa.
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          cp dist/fallout2-ce-android-controlli/*.apk out/fallout2-ce-controlli-android.apk
          if ls dist/fallout2-ce-ios-controlli/*.ipa >/dev/null 2>&1; then
            cp dist/fallout2-ce-ios-controlli/*.ipa out/fallout2-ce-controlli-ios.ipa
          else
            gh release download controlli-latest --repo "$GITHUB_REPOSITORY" -p '*.ipa' -D out || true
          fi
          gh release delete controlli-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create controlli-latest out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Controlli mobile (ultima build)" \
            --notes "Versione con controller e tocco diretto. Vedi CONTROLLI.md."
