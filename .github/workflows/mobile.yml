# Compila la versione con i controlli mobile (controller + tocco diretto)
# per iPhone (.ipa da firmare con Sideloadly) e Android (.apk).
# Parte a ogni push sul ramo controlli-mobile, oppure a mano da Actions.
name: Mobile

on:
  push:
    branches:
      - controlli-mobile
  workflow_dispatch:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: gradle

      - name: Build
        run: |
          cd os/android
          ./gradlew assembleRelease

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fallout2-ce-android-controlli
          path: os/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  ios:
    name: iOS
    runs-on: macos-14
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Build
        run: |
          cmake --preset ios
          cmake --build --preset ios-release
          cd out/build/ios
          cpack -C RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fallout2-ce-ios-controlli
          path: out/build/ios/fallout2-ce.ipa
          retention-days: 30
